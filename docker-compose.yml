# docker compose up --build   ->  frontend http://localhost:8501, API http://localhost:8000
# Settings come from .env (optional: without it the app runs with AI features off).

services:
  backend:
    build: .
    image: insightsql-ai:latest
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
    volumes:
      - insightsql-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"  # no login: this machine only (DEPLOYMENT.md section 5)
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    image: insightsql-ai:latest
    command: ["streamlit", "run", "frontend/app.py",
              "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:8501:8501"  # no login: this machine only (DEPLOYMENT.md section 5)
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  insightsql-data:
    name: insightsql-data  # a fixed name, so the backup command in DEPLOYMENT.md finds it
