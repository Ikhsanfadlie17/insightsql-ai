[project]
name = "insightsql-ai"
version = "0.1.0"
description = "AI-powered data analytics and BI platform (Text-to-SQL on DuckDB)"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["perf: slow performance tests (excluded by default)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
