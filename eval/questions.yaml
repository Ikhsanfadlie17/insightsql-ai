# InsightSQL AI — Text-to-SQL evaluation set (PRD §9).
# Dataset: sample_data/client_services.csv (795 rows, 2023-01-03 .. 2026-10-31), imported
# with the default options and the suggested column mapping confirmed. Columns:
# id_klien, nama_klien, tanggal_layanan (date), departemen, jenis_layanan,
# pendapatan_rp (integer, 26 missing), status (Selesai / Proses / Dibatalkan).
#
# expected.kind:
#   result     reference_sql is run on the same table; the model's result must contain the
#              same rows (order-insensitive; columns matched by values; numeric tolerance 1e-6,
#              or equal after rounding the reference to the model's decimals).
#   retention  the analytics engine computes `metric` for `previous` / `current`
#              ([start, end) dates); the answer must contain the same value(s).
#   clarify    the assistant must ask a clarifying question and run nothing.
#   reject     the assistant must refuse (unsupported) and run nothing.
# Questions are written so that each has one defensible answer; anything open to more than
# one reading is in the "ambiguous" category on purpose.

# ----------------------------------------------------------------- 1. simple aggregation
- id: agg-01
  category: simple_aggregation
  language: id
  question: Berapa total pendapatan dari seluruh transaksi?
  expected: {kind: result, reference_sql: "SELECT SUM(pendapatan_rp) AS total FROM dataset"}
- id: agg-02
  category: simple_aggregation
  language: en
  question: How many transactions are in the dataset?
  expected: {kind: result, reference_sql: "SELECT COUNT(*) AS n FROM dataset"}
- id: agg-03
  category: simple_aggregation
  language: id
  question: Berapa jumlah klien unik di seluruh data?
  expected: {kind: result, reference_sql: "SELECT COUNT(DISTINCT id_klien) AS n FROM dataset"}
- id: agg-04
  category: simple_aggregation
  language: en
  question: What is the average revenue per transaction, ignoring transactions without revenue?
  expected: {kind: result, reference_sql: "SELECT AVG(pendapatan_rp) AS avg_revenue FROM dataset"}
- id: agg-05
  category: simple_aggregation
  language: id
  question: Berapa nilai pendapatan terbesar dari satu transaksi?
  expected: {kind: result, reference_sql: "SELECT MAX(pendapatan_rp) AS max_revenue FROM dataset"}

# ------------------------------------------------------------------------- 2. filtering
- id: flt-01
