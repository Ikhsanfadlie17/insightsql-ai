- id: flt-02
  category: filtering
  language: en
  question: What is the total revenue of the Audit department?
  expected:
    kind: result
    reference_sql: "SELECT SUM(pendapatan_rp) AS total FROM dataset WHERE departemen = 'Audit'"
- id: flt-03
  category: filtering
  language: id
  question: Berapa total pendapatan dari layanan Implementasi ERP?
  expected:
    kind: result
    reference_sql: >-
      SELECT SUM(pendapatan_rp) AS total FROM dataset WHERE jenis_layanan = 'Implementasi ERP'
- id: flt-04
  category: filtering
  language: en
  question: How many transactions have no revenue recorded?
  expected:
    kind: result
    reference_sql: "SELECT COUNT(*) AS n FROM dataset WHERE pendapatan_rp IS NULL"
- id: flt-05
  category: filtering
  language: id
  question: Berapa jumlah transaksi dengan pendapatan di atas 100 juta rupiah?
  expected:
    kind: result
    reference_sql: "SELECT COUNT(*) AS n FROM dataset WHERE pendapatan_rp > 100000000"

# -------------------------------------------------------------------------- 3. grouping
- id: grp-01
  category: grouping
  language: id
  question: Berapa jumlah transaksi per departemen?
  expected:
    kind: result
    reference_sql: "SELECT departemen, COUNT(*) AS n FROM dataset GROUP BY departemen"
- id: grp-02
  category: grouping
  language: en
  question: What is the total revenue for each service type?
  expected:
    kind: result
    reference_sql: >-
      SELECT jenis_layanan, SUM(pendapatan_rp) AS total FROM dataset GROUP BY jenis_layanan
- id: grp-03
  category: grouping
  language: id
  question: Berapa jumlah transaksi untuk masing-masing status?
  expected:
    kind: result
    reference_sql: "SELECT status, COUNT(*) AS n FROM dataset GROUP BY status"
- id: grp-04
  category: grouping
  language: en
  question: How many unique clients does each department have across all years?
  expected:
    kind: result
    reference_sql: >-
      SELECT departemen, COUNT(DISTINCT id_klien) AS clients FROM dataset GROUP BY departemen
- id: grp-05
  category: grouping
  language: id
  question: Berapa rata-rata pendapatan per transaksi untuk setiap departemen?
  expected:
    kind: result
    reference_sql: >-
      SELECT departemen, AVG(pendapatan_rp) AS rata_rata FROM dataset GROUP BY departemen

# --------------------------------------------------------------------- 4. date analysis
- id: dat-01
  category: date_analysis
  language: id
  question: Berapa total pendapatan per bulan pada tahun 2025?
  expected:
    kind: result
    reference_sql: >-
      SELECT date_trunc('month', tanggal_layanan) AS bulan, SUM(pendapatan_rp) AS total
      FROM dataset WHERE year(tanggal_layanan) = 2025 GROUP BY 1
- id: dat-02
  category: date_analysis
  language: en
  question: How many transactions were recorded in each calendar year?
  expected:
    kind: result
    reference_sql: >-
      SELECT year(tanggal_layanan) AS tahun, COUNT(*) AS n FROM dataset GROUP BY 1
- id: dat-03
  category: date_analysis
  language: id
  question: Bulan apa di tahun 2025 yang memiliki total pendapatan tertinggi?
  expected:
    kind: result
    reference_sql: >-
      SELECT date_trunc('month', tanggal_layanan) AS bulan, SUM(pendapatan_rp) AS total
      FROM dataset WHERE year(tanggal_layanan) = 2025 GROUP BY 1 ORDER BY 2 DESC LIMIT 1
- id: dat-04
  category: date_analysis
  language: en
  question: What was the total revenue in the first quarter (January to March) of 2026?
  expected:
    kind: result
    reference_sql: >-
      SELECT SUM(pendapatan_rp) AS total FROM dataset
      WHERE tanggal_layanan >= DATE '2026-01-01' AND tanggal_layanan < DATE '2026-04-01'
- id: dat-05
  category: date_analysis
  language: id
  question: Kapan tanggal transaksi pertama dan transaksi terakhir di data ini?
  expected:
    kind: result
    reference_sql: >-
      SELECT MIN(tanggal_layanan) AS pertama, MAX(tanggal_layanan) AS terakhir FROM dataset

# ------------------------------------------------------------------- 5. client retention
- id: ret-01
  category: client_retention
  language: id
  question: Berapa tingkat retensi klien dari tahun 2024 ke tahun 2025?
  expected:
    kind: retention
    previous: {start: "2024-01-01", end: "2025-01-01"}
    current: {start: "2025-01-01", end: "2026-01-01"}
    metric: retention_rate
- id: ret-02
  category: client_retention
  language: en
  question: How many clients that were active in 2024 were also active in 2025?
  expected:
    kind: retention
    previous: {start: "2024-01-01", end: "2025-01-01"}
    current: {start: "2025-01-01", end: "2026-01-01"}
    metric: returning
- id: ret-03
  category: client_retention
  language: id
  question: Berapa klien yang aktif di 2024 tetapi tidak bertransaksi lagi di 2025?
  expected:
    kind: retention
    previous: {start: "2024-01-01", end: "2025-01-01"}
    current: {start: "2025-01-01", end: "2026-01-01"}
    metric: not_returned
- id: ret-04
  category: client_retention
  language: en
  question: Compare the number of active clients in January–June 2025 with January–June 2026.
  expected:
    kind: retention
    previous: {start: "2025-01-01", end: "2025-07-01"}
    current: {start: "2026-01-01", end: "2026-07-01"}
    metric: [previous_active, current_active]
- id: ret-05
  category: client_retention
  language: id
  question: Bandingkan jumlah klien aktif Januari–Oktober 2025 dengan Januari–Oktober 2026.
  expected:
    kind: retention
    previous: {start: "2025-01-01", end: "2025-11-01"}
    current: {start: "2026-01-01", end: "2026-11-01"}
    metric: [previous_active, current_active]

# ------------------------------------------------------------- 6. new vs existing clients
- id: new-01
  category: new_vs_existing
  language: id
  question: Berapa klien baru di tahun 2025, yaitu klien yang belum pernah bertransaksi sebelumnya?
  expected:
    kind: retention
    previous: {start: "2024-01-01", end: "2025-01-01"}
    current: {start: "2025-01-01", end: "2026-01-01"}
    metric: new
- id: new-02
  category: new_vs_existing
  language: en
  question: >-
    How many clients came back in 2025 after not buying in 2024, although they had bought
    before 2024 (reactivated clients)?
  expected:
    kind: retention
    previous: {start: "2024-01-01", end: "2025-01-01"}
    current: {start: "2025-01-01", end: "2026-01-01"}
    metric: reactivated
- id: new-03
  category: new_vs_existing
  language: id
  question: Berapa persen klien aktif 2025 yang merupakan klien baru, dibandingkan dengan 2024?
  expected:
    kind: retention
    previous: {start: "2024-01-01", end: "2025-01-01"}
    current: {start: "2025-01-01", end: "2026-01-01"}
    metric: new_client_rate
- id: new-04
  category: new_vs_existing
  language: en
  question: How many of the clients active in 2025 had already bought something before 2025?
  expected:
    kind: retention
    previous: {start: "2024-01-01", end: "2025-01-01"}
    current: {start: "2025-01-01", end: "2026-01-01"}
    metric: existing_active
- id: new-05
  category: new_vs_existing
  language: id
  question: Berapa klien baru pada Januari–Juni 2026 jika dibandingkan dengan Januari–Juni 2025?
  expected:
    kind: retention
    previous: {start: "2025-01-01", end: "2025-07-01"}
    current: {start: "2026-01-01", end: "2026-07-01"}
    metric: new

# ------------------------------------------------------------- 7. multi-condition queries
- id: mul-01
  category: multi_condition
  language: id
  question: Berapa total pendapatan departemen Audit yang berstatus Selesai pada tahun 2025?
  expected:
    kind: result
    reference_sql: >-
      SELECT SUM(pendapatan_rp) AS total FROM dataset WHERE departemen = 'Audit'
      AND status = 'Selesai' AND year(tanggal_layanan) = 2025
- id: mul-02
  category: multi_condition
  language: en
  question: How many unique clients used Konsultasi Pajak in 2026 with status Selesai?
  expected:
    kind: result
    reference_sql: >-
      SELECT COUNT(DISTINCT id_klien) AS clients FROM dataset WHERE jenis_layanan =
      'Konsultasi Pajak' AND status = 'Selesai' AND year(tanggal_layanan) = 2026
- id: mul-03
  category: multi_condition
  language: id
  question: >-
    Berapa jumlah transaksi departemen Pelatihan atau Perpajakan dengan pendapatan di atas
    50 juta rupiah?
  expected:
    kind: result
    reference_sql: >-
      SELECT COUNT(*) AS n FROM dataset WHERE departemen IN ('Pelatihan', 'Perpajakan')
      AND pendapatan_rp > 50000000
- id: mul-04
  category: multi_condition
  language: en
  question: What is the total revenue per department in 2025, counting only Selesai transactions?
  expected:
    kind: result
    reference_sql: >-
      SELECT departemen, SUM(pendapatan_rp) AS total FROM dataset
      WHERE year(tanggal_layanan) = 2025 AND status = 'Selesai' GROUP BY departemen
- id: mul-05
  category: multi_condition
  language: id
  question: Jenis layanan apa saja yang memiliki lebih dari 80 transaksi?
  expected:
    kind: result
    reference_sql: >-
      SELECT jenis_layanan, COUNT(*) AS n FROM dataset GROUP BY jenis_layanan
      HAVING COUNT(*) > 80

