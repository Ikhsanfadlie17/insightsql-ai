# ------------------------------------------------------ 10. complex business analytics
- id: cpx-01
  category: complex_business
  language: id
  question: >-
    Departemen mana yang selisih total pendapatannya (dalam rupiah) paling besar naik dari
    2024 ke 2025, dan berapa selisihnya?
  expected:
    kind: result
    reference_sql: >-
      SELECT departemen,
      SUM(CASE WHEN year(tanggal_layanan) = 2025 THEN pendapatan_rp ELSE 0 END)
      - SUM(CASE WHEN year(tanggal_layanan) = 2024 THEN pendapatan_rp ELSE 0 END) AS selisih
      FROM dataset GROUP BY departemen ORDER BY selisih DESC LIMIT 1
- id: cpx-02
  category: complex_business
  language: en
  question: >-
    What percentage (0 to 100) of the total 2025 revenue came from each department?
  expected:
    kind: result
    reference_sql: >-
      SELECT departemen, SUM(pendapatan_rp) * 100.0 / (SELECT SUM(pendapatan_rp) FROM dataset
      WHERE year(tanggal_layanan) = 2025) AS pct FROM dataset
      WHERE year(tanggal_layanan) = 2025 GROUP BY departemen
- id: cpx-03
  category: complex_business
  language: id
  question: Siapa 5 klien (berdasarkan ID klien) dengan total pendapatan terbesar sepanjang data?
  expected:
    kind: result
    reference_sql: >-
      SELECT id_klien, SUM(pendapatan_rp) AS total FROM dataset WHERE id_klien IS NOT NULL
      GROUP BY id_klien ORDER BY total DESC LIMIT 5
- id: cpx-04
  category: complex_business
  language: en
  question: >-
    For each year, what is the total revenue divided by the number of unique clients in that
    year?
  expected:
    kind: result
    reference_sql: >-
      SELECT year(tanggal_layanan) AS tahun, SUM(pendapatan_rp) * 1.0 / COUNT(DISTINCT id_klien)
      AS revenue_per_client FROM dataset GROUP BY 1
- id: cpx-05
  category: complex_business
  language: id
  question: >-
    Departemen mana yang paling banyak memiliki transaksi Dibatalkan, dan berapa persen dari
    seluruh transaksi departemen itu yang dibatalkan (0–100)?
  expected:
    kind: result
    reference_sql: >-
      SELECT departemen, COUNT(*) FILTER (WHERE status = 'Dibatalkan') AS dibatalkan,
      COUNT(*) FILTER (WHERE status = 'Dibatalkan') * 100.0 / COUNT(*) AS pct
      FROM dataset GROUP BY departemen ORDER BY dibatalkan DESC LIMIT 1
